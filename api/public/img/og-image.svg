<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a227"/>
      <stop offset="100%" style="stop-color:#e8d48b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative shapes -->
  <circle cx="1050" cy="100" r="200" fill="#c9a227" opacity="0.08"/>
  <circle cx="150" cy="530" r="150" fill="#c9a227" opacity="0.06"/>

  <!-- Shield icon -->
  <g transform="translate(100, 180)">
    <path d="M60 0 L120 30 L120 90 C120 130 90 160 60 175 C30 160 0 130 0 90 L0 30 Z"
          fill="none" stroke="#c9a227" stroke-width="4"/>
    <path d="M60 20 L100 42 L100 85 C100 115 80 135 60 148 C40 135 20 115 20 85 L20 42 Z"
          fill="#c9a227" opacity="0.15"/>
    <polyline points="38,80 52,98 85,60" fill="none" stroke="#c9a227" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand name -->
  <text x="280" y="230" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="28" fill="#9ca3af" letter-spacing="4">DỊCH VỤ THUẾ KẾ TOÁN</text>
  <text x="280" y="300" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="72" font-weight="bold" fill="#c9a227">TADA</text>

  <!-- Tagline -->
  <text x="280" y="360" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="30" fill="#e5e7eb">Chatbot AI Tư Vấn Thuế Miễn Phí 24/7</text>

  <!-- Features -->
  <g transform="translate(280, 410)">
    <rect x="0" y="0" width="200" height="44" rx="22" fill="#c9a227" opacity="0.12"/>
    <text x="100" y="28" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="15" fill="#c9a227" text-anchor="middle">TNCN • TNDN • GTGT</text>

    <rect x="220" y="0" width="200" height="44" rx="22" fill="#c9a227" opacity="0.12"/>
    <text x="320" y="28" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="15" fill="#c9a227" text-anchor="middle">Hóa đơn điện tử</text>

    <rect x="440" y="0" width="220" height="44" rx="22" fill="#c9a227" opacity="0.12"/>
    <text x="550" y="28" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="15" fill="#c9a227" text-anchor="middle">Kê khai thuế HKD</text>

    <rect x="680" y="0" width="200" height="44" rx="22" fill="#c9a227" opacity="0.12"/>
    <text x="780" y="28" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="15" fill="#c9a227" text-anchor="middle">Bảo hiểm xã hội</text>
  </g>

  <!-- URL -->
  <text x="600" y="580" font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle">ketoanthuetada.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
