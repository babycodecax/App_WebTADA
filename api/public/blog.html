<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài viết — TADA</title>
  <meta name="description" content="Bài viết về thuế, kế toán, BHXH từ Dịch vụ Thuế Kế Toán TADA.">
  <link rel="stylesheet" href="static/css/styles.css">
  <link rel="stylesheet" href="static/css/blog.css">
</head>
<body>
  <header class="header" id="header">
    <div class="container header-container">
      <a href="/" class="logo-link">
        <img src="static/img/logo.jpg" alt="TADA" class="logo-img">
        <div class="logo-text">
          <span class="logo-brand-main">DỊCH VỤ THUẾ KẾ TOÁN</span>
          <span class="logo-brand-accent">TADA</span>
        </div>
      </a>
      <nav class="nav" id="nav-menu">
        <a href="/" class="nav-link">Trang chủ</a>
        <a href="/#services" class="nav-link">Dịch vụ</a>
        <a href="/blog" class="nav-link active">Bài viết</a>
      </nav>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle Navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="blog-page">
    <section class="blog-header">
      <div class="container">
        <h1>Bài viết & Hướng dẫn</h1>
        <p>Kiến thức thuế, kế toán, BHXH và thủ tục doanh nghiệp từ TADA.</p>
      </div>
    </section>

    <section class="blog-list-section">
      <div class="container">
        <div class="blog-grid" id="blog-grid">
          <div class="blog-loading">Đang tải bài viết...</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Dịch vụ Thuế Kế Toán TADA.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="static/js/blog.js"></script>
</body>
</html>
