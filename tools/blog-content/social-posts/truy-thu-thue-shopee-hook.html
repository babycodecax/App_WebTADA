<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background: url('https://images.unsplash.com/photo-1507400492013-162706c8c05e?w=1200&q=85') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px 70px;
    font-family: 'Caveat', cursive, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .text {
    color: #fff;
    font-size: 72px;
    font-weight: 900;
    text-align: center;
    line-height: 1.35;
    text-shadow: 0 4px 20px rgba(0,0,0,0.45);
    z-index: 1;
    max-width: 950px;
  }
  .emoji {
    font-size: 72px;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.3));
  }
</style>
</head>
<body>
  <div class="text">
    Nhận được cuộc gọi<br>từ cơ quan thuế,<br>
    tưởng lừa đảo<br>nhưng cuối cùng là thật 🫠
  </div>
</body>
</html>
